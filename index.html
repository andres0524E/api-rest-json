<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Explorador de Anime</title>

  <!-- favicon -->
  <link rel="icon" href="assets/favicon.png">

  <!-- bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- estilos -->
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<!-- fondo blur dinámico -->
<div id="bgBlur"></div>

<!-- navbar -->
<nav class="navbar navbar-dark bg-dark shadow">
  <div class="container d-flex justify-content-between align-items-center">
    <span class="navbar-brand">🎌 Explorador de Anime</span>

    <!-- 🔥 botón idioma -->
    <button id="langBtn" class="btn btn-outline-light btn-sm">
      🌎 ES / EN
    </button>
  </div>
</nav>

<!-- contenido -->
<div class="container mt-4">

  <h2 class="mb-3">Selecciona un anime</h2>

  <!-- select dinámico -->
  <select id="animeSelect" class="form-select mb-4"></select>

  <!-- loader -->
  <div id="loader" class="text-center mb-3">
    ⏳ Cargando...
  </div>

  <!-- 🔥 DETALLE (LO PRINCIPAL) -->
  <div id="result" class="mb-5"></div>

  <!-- 🔥 GRID (EXPLORACIÓN) -->
  <h4 class="mb-3">Explorar más animes</h4>
  <div id="animeGrid" class="mb-4"></div>

  <!-- ip -->
  <div class="mt-4 text-center">
    <h5>🌐 Tu IP:</h5>
    <p id="ip"></p>
  </div>

</div>

<!-- footer -->
<footer class="bg-dark text-white text-center p-3 mt-5">
  Andres Cruz - Desarrollo Web
</footer>

<!-- script principal -->
<script type="module" src="assets/js/app.js"></script>

</body>
</html>
