<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explorador de Anime</title>

  <link rel="icon" href="./assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/styles.css">
</head>
<body>

<!-- Partículas de fondo -->
<canvas id="particles"></canvas>

<!-- Fondo blur dinámico -->
<div id="bgBlur"></div>
<div id="bgOverlay"></div>

<!-- Navbar -->
<nav class="navbar">
  <div class="nav-inner">
    <div class="nav-logo">
      <span class="logo-icon">鬼</span>
      <span class="logo-text">ANIME<span class="logo-accent">XPL</span></span>
    </div>
    <div class="nav-actions">
      <button id="langBtn" class="lang-btn">
        <span class="lang-icon">🌐</span>
        <span id="langLabel">ES</span>
      </button>
    </div>
  </div>
</nav>

<!-- Hero Select -->
<div class="hero-section">
  <p class="hero-sub" id="heroSub">Selecciona un anime para explorar</p>
  <div class="select-wrapper">
    <select id="animeSelect" class="anime-select"></select>
    <span class="select-arrow">▾</span>
  </div>
</div>

<!-- Contenido principal -->
<main class="main-content">

  <!-- Loader -->
  <div id="loader" class="loader">
    <div class="loader-ring"></div>
    <span class="loader-text">Cargando...</span>
  </div>

  <!-- Detalle del anime -->
  <div id="result" class="result-area"></div>

  <!-- Grid exploración -->
  <section class="explore-section">
    <div class="section-header">
      <h3 class="section-title" id="exploreTitle">Explorar Animes</h3>
      <div class="title-line"></div>
    </div>
    <div id="animeGrid" class="anime-grid"></div>
  </section>

  <!-- IP -->
  <div class="ip-section">
    <span class="ip-label">🌐 IP:</span>
    <span id="ip" class="ip-value">—</span>
  </div>

</main>

<!-- Footer -->
<footer class="footer">
  <p>Andres Cruz · <span class="footer-accent">Desarrollo Web</span></p>
</footer>

<script type="module" src="assets/js/app.js"></script>
</body>
</html>
